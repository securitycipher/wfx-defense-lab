name: status-forge
# Reproduces the wfx "required check forgery" step with a harmless status.
on:
  push:
    branches: ["forge/**"]

permissions:
  statuses: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Post a fake "build" success on our own commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -o /dev/null -w 'status POST -> HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"build","description":"wfx-lab forged"}'
