name: secret-scope
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repo-level:
    runs-on: ubuntu-latest
    steps:
      - name: What can toJSON(secrets) see in a plain job?
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "secret names: $(jq -r 'keys | join(", ")' <<<"$ALL")"
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c 'import sys,json,base64;p=sys.argv[1].split(".")[1];p+="="*(-len(p)%4);print("oidc sub:",json.loads(base64.urlsafe_b64decode(p))["sub"])' "$tok"

  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: What can toJSON(secrets) see inside the production environment?
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "secret names: $(jq -r 'keys | join(", ")' <<<"$ALL")"
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c 'import sys,json,base64;p=sys.argv[1].split(".")[1];p+="="*(-len(p)%4);print("oidc sub:",json.loads(base64.urlsafe_b64decode(p))["sub"])' "$tok"
